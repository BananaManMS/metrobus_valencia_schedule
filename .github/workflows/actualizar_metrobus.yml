name: Actualizar Metrobús

on:
  schedule:
    # 00:17 UTC los lunes (02:17 CEST / 01:17 CET)
    - cron: '17 0 * * 1'
  workflow_dispatch:

concurrency:
  group: metrobus-update
  cancel-in-progress: false

jobs:
  scrape-metrobus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install aiohttp

      - name: Ejecutar Extractor
        run: |
          python scraper.py

      - name: Guardar cambios si hay novedades
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "Sin cambios en la red de Metrobús."
          else
            git commit -m "chore(metrobus): actualización semanal de paradas, líneas y polylines"
            git pull --rebase
            git push
          fi
