name: Actualizar Metrobús

on:
  schedule:
    # 01:02 UTC los lunes (aprox 03:02 hora de España peninsular)
    - cron: '2 1 * * 1'
  workflow_dispatch:

jobs:
  scrape-metrobus:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install aiohttp

      - name: Ejecutar Extractor
        run: |
          python scraper.py

      - name: Guardar cambios si hay novedades
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          
          if git diff --staged --quiet; then
            echo "Sin cambios en la red de Metrobús."
          else
            git commit -m "chore(metrobus): actualización semanal de paradas, líneas y polylines"
            git push
          fi
