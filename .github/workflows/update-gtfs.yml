name: Actualizar GTFS Metrobús

on:
  schedule:
    - cron: "0 22 * * *"  # Todos los días a las 22:00 UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente

# Permisos necesarios para publicar en GitHub Pages y hacer commit
permissions:
  contents: write
  pages: write
  id-token: write

# Permite un solo despliegue simultáneo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Generar SQLite desde GTFS
        run: python gtfs_to_sqlite.py

      - name: Exportar JSON por parada
        run: python export_stop_json.py

      - name: Guardar cambios en el repositorio (Git Commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f metrobus.sqlite docs/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "bot: actualizar GTFS y JSONs ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configurar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Desplegar directamente a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
